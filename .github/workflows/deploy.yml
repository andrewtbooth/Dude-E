# One-tap deployment. No terminal, no Docker.
#
# Everything the manual runbook did from a laptop happens here instead: the
# image is built on Fly's own builders (`--remote-only`), so nothing needs
# Docker locally, and every step is written to be safe to re-run. That matters
# more than elegance here — the person triggering this is not expected to be
# able to debug a half-finished deploy from a phone.
#
# Setup is two repository secrets. See docs/SETUP.md.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      run_tariff_sync:
        description: "Download the current tariff after deploying (needed on the first run)"
        type: boolean
        default: true
      app_name:
        description: "Fly app name (leave blank to use the one in fly.toml)"
        type: string
        default: ""

concurrency:
  # Two deploys racing onto one volume is a bad time.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A broken build reaching production is worse than a failed deploy, and
      # the person triggering this cannot easily tell the two apart afterwards.
      - name: Check the code is sound
        run: |
          npm ci
          # The Prisma client is generated code, and prisma/generated/ is
          # gitignored — so a fresh checkout does not have it and every type
          # that comes from the database is missing. That surfaces as a module
          # error in src/lib/db.ts plus a scatter of implicit-any errors in
          # unrelated files, which reads like several problems rather than one.
          # The Dockerfile already does this before `next build`; the check
          # needs it for the same reason.
          npx prisma generate
          npx tsc --noEmit
          npx eslint .
          npx vitest run

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Checked here, before anything uses it, because every flyctl command
      # fails the same unhelpful way without it: "no access token available".
      # Read from inside a step that has already decided the app is missing,
      # that reads as a name collision or a permissions problem, and sends you
      # looking at Fly rather than at this repository's settings.
      - name: Check the Fly token is present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            {
              echo "## FLY_API_TOKEN is not set"
              echo ""
              echo "This repository has no \`FLY_API_TOKEN\` secret, so nothing here"
              echo "can talk to Fly. Nothing was changed and your app is untouched."
              echo ""
              echo "To fix it:"
              echo ""
              echo "1. Fly dashboard → your app → **Tokens** → create a deploy token"
              echo "2. Copy the whole value (it starts with \`FlyV1\`)"
              echo "3. GitHub → this repo → **Settings** → **Secrets and variables** →"
              echo "   **Actions** → **New repository secret**"
              echo "4. Name it exactly \`FLY_API_TOKEN\`, paste the value, save"
              echo "5. Run this workflow again"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::FLY_API_TOKEN is not set in this repository's secrets. See the run summary."
            exit 1
          fi
          echo "Fly token present."

      - name: Resolve app name
        id: app
        run: |
          NAME="${{ inputs.app_name }}"
          if [ -z "$NAME" ]; then
            NAME=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Deploying to Fly app: $NAME"

      # An app-scoped deploy token — which is all Fly issues when your account
      # belongs to an SSO-enforced organisation — cannot create apps. So this
      # only tries when the app is genuinely absent, and explains the fix
      # rather than failing with a permissions error.
      - name: Create the app if it does not exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="${{ steps.app.outputs.name }}"
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "App already exists."
            exit 0
          fi
          echo "Creating app…"
          if ! flyctl apps create "$APP" --org personal; then
            echo "::error::Could not create the app '$APP'. Most likely your Fly"
            echo "::error::token is app-scoped — a deploy token can manage an app"
            echo "::error::but cannot create one. If so, create it in the Fly"
            echo "::error::dashboard named exactly '$APP' and re-run."
            echo "::error::Failing that, the name may be taken globally: re-run"
            echo "::error::with a different name in the app_name box."
            exit 1
          fi

      - name: Create the storage volume if it does not exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="${{ steps.app.outputs.name }}"
          REGION=$(grep -m1 '^primary_region = ' fly.toml | cut -d'"' -f2)
          # The volume holds the tariff snapshot and the audit database. Without
          # it both are wiped on every deploy, silently.
          if flyctl volumes list --app "$APP" | grep -q dude_e_data; then
            echo "Volume already exists."
            exit 0
          fi
          echo "Creating volume in $REGION…"
          if ! flyctl volumes create dude_e_data \
                 --app "$APP" --region "$REGION" --size 3 --yes; then
            echo "::error::Could not create the volume. If your Fly token is"
            echo "::error::app-scoped, create it in the Fly dashboard instead:"
            echo "::error::app '$APP' -> Volumes -> name 'dude_e_data', 3GB, region $REGION."
            exit 1
          fi

      - name: Set secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="${{ steps.app.outputs.name }}"
          EXISTING=$(flyctl secrets list --app "$APP" 2>/dev/null || true)

          # Both of these follow the same rule: set what is genuinely missing,
          # leave alone what is already there.
          #
          # SESSION_SECRET signs the analyst cookie — rotating it on every
          # deploy would sign everyone out mid-run.
          #
          # ANTHROPIC_API_KEY is treated the same way rather than being pushed
          # from GitHub every time. An app set up through Fly's own UI already
          # has the key on Fly, and demanding a second copy in GitHub means the
          # same credential in two places, either of which can leak or drift.
          # Providing it here is still supported and is how you rotate it.
          ARGS=""

          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY supplied by this repository; setting it."
            ARGS="$ARGS ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
          elif echo "$EXISTING" | grep -q ANTHROPIC_API_KEY; then
            echo "ANTHROPIC_API_KEY already set on the app; leaving it alone."
          else
            {
              echo "## ANTHROPIC_API_KEY is not set anywhere"
              echo ""
              echo "It is not a secret in this repository and it is not set on the"
              echo "Fly app either, so the deployed app could not classify anything."
              echo ""
              echo "Set it in **either** place:"
              echo ""
              echo "- Fly dashboard → your app → **Secrets** → add \`ANTHROPIC_API_KEY\`, or"
              echo "- GitHub → **Settings** → **Secrets and variables** → **Actions**"
              echo ""
              echo "One is enough. Nothing was deployed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::ANTHROPIC_API_KEY is set neither in this repository nor on the Fly app. See the run summary."
            exit 1
          fi

          if echo "$EXISTING" | grep -q SESSION_SECRET; then
            echo "SESSION_SECRET already set; leaving it alone."
          else
            echo "Generating SESSION_SECRET…"
            ARGS="$ARGS SESSION_SECRET=$(openssl rand -base64 48)"
          fi

          if [ -n "$ARGS" ]; then
            # Unquoted on purpose: ARGS holds whole KEY=VALUE pairs that must
            # split into separate arguments. Neither value contains a space —
            # an Anthropic key has none, and base64 emits none.
            # shellcheck disable=SC2086
            flyctl secrets set --app "$APP" --stage $ARGS
          else
            echo "Both secrets already present; nothing to change."
          fi

      # --remote-only builds the image on Fly's builders, which is what makes
      # this runnable from a device that has no Docker.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --app "${{ steps.app.outputs.name }}" \
            --remote-only --wait-timeout 600

      # The container seeds the tariff itself on first boot, so this is a
      # refresh rather than a requirement. It needs SSH, which an app-scoped
      # deploy token may not grant — so a failure here is reported and
      # tolerated instead of failing the deploy.
      - name: Refresh the tariff
        if: ${{ inputs.run_tariff_sync }}
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl ssh console --app "${{ steps.app.outputs.name }}" \
               -C "npm run sync:htsus"; then
            echo "Tariff refreshed."
          else
            echo "::warning::Could not run the sync over SSH — likely an"
            echo "::warning::app-scoped token. Not a problem on a first deploy:"
            echo "::warning::the app downloads the tariff itself on startup."
          fi

      - name: Verify it is serving
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          URL="https://${{ steps.app.outputs.name }}.fly.dev"
          echo "Checking $URL/api/health …"
          # Up to four minutes: the app answers within seconds, but on a first
          # deploy it is downloading the tariff in the background and reports
          # "degraded" until that finishes.
          for attempt in $(seq 1 24); do
            BODY=$(curl -fsS --max-time 20 "$URL/api/health" || true)
            case "$BODY" in
              *'"status":"ok"'*) break ;;
              "") echo "  not answering yet ($attempt/24)" ;;
              *) echo "  up, tariff still downloading ($attempt/24)" ;;
            esac
            sleep 10
          done

          if [ -z "$BODY" ]; then
            echo "::error::The app did not answer its health check. Run: flyctl logs --app ${{ steps.app.outputs.name }}"
            exit 1
          fi

          echo "$BODY"
          STATUS=$(printf '%s' "$BODY" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')

          {
            echo "## Deployment complete"
            echo ""
            echo "**Your app:** $URL"
            echo ""
            if [ "$STATUS" = "ok" ]; then
              REVISION=$(printf '%s' "$BODY" | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p')
              echo "Tariff loaded: **$REVISION**. Open the link and sign in with your name and email."
            else
              echo "The app is running but the tariff is **still downloading**."
              echo "Wait a couple of minutes, then reload the site. If it has not"
              echo "finished after five minutes, check the logs in the Fly dashboard."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
