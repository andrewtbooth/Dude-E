# Fly.io deployment for the tariff classification workbench.
#
# Fly is the fit here for two reasons that are properties of this app rather
# than preferences: a single analysis holds an SSE connection open for up to
# thirteen minutes, and the tariff snapshot plus the audit database are files
# on disk. Platforms that cap request duration or hand you an ephemeral
# filesystem require reworking the app rather than configuring it.
#
# The app name must match the app created in the Fly dashboard, and
# `internal_port` below must match the PORT the container listens on (3000,
# set in the Dockerfile). Fly's own generated fly.toml defaults to 8080; left
# unchanged that mismatch passes the build and then fails every health check.

app = "dude-e"
# Must match the region the volume was created in — a deploy that names a
# region with no volume in it fails to place the machine.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # Both pieces of durable state live on the mounted volume.
  HTSUS_DATA_DIR = "/data/htsus"
  # flyctl warns that DATABASE_URL "may be sensitive" and suggests a secret.
  # It is not, here: SQLite's URL is a path on the mounted volume, with no
  # host, user or password in it. It belongs in [env] where it is readable.
  DATABASE_URL = "file:/data/dude-e.db"
  PORT = "3000"

# The snapshot is ~60 MB and the audit database grows slowly. 3 GB is generous
# and leaves room to keep a previous revision alongside the current one.
[[mounts]]
  source = "dude_e_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # A machine that stops mid-analysis kills the run and loses the work. Keep
  # one machine up rather than suspending on idle.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # The single most important line in this file. A max-effort analysis streams
  # for minutes; the default idle timeout would sever it and the UI's failure
  # mode for a dropped stream is the progress log simply stopping.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 12

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

# One shared CPU is not enough: PDF rendering and the SQLite FTS queries are
# both synchronous and would block the event loop during a stream.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
